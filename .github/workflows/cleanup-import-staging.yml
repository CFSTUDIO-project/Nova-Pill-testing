name: Clean up temporary NOVA PILL staging data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-import-staging.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Remove temporary import data
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .nova-pill-import
          git rm .github/workflows/cleanup-import-staging.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary import staging data"
          git push